# Compila e empacota o monitor virtual TabletMonitor.
name: Windows Virtual Display Driver

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "driver/**"
      - ".github/workflows/driver-ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build x64
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore WDK packages
        shell: pwsh
        run: |
          nuget restore "driver\packages.config" `
              -PackagesDirectory "driver\packages" `
              -NonInteractive

      - name: Build driver and host
        shell: pwsh
        run: |
          $WdkBin = Join-Path $PWD `
              "driver\packages\Microsoft.Windows.WDK.x64.10.0.28000.1839\c\bin\10.0.28000.0"

          $env:Path = @(
              (Join-Path $WdkBin "x64"),
              (Join-Path $WdkBin "x86"),
              $env:Path
          ) -join ";"

          Get-Command "stampinf.exe" |
              Select-Object -ExpandProperty Source

          msbuild "driver\TabletMonitor.VirtualDisplay.sln" `
              /m `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /p:SignMode=Off `
              /p:Inf2CatUseLocalTime=true

      - name: Create driver catalog
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"
          $ReleaseRoot = Join-Path $PWD "driver\x64\Release"
          $Inf = Join-Path $ReleaseRoot "TabletMonitor.VirtualDisplay.inf"
          $Dll = Join-Path $ReleaseRoot "TabletMonitor.VirtualDisplay.dll"
          $Catalog = Join-Path $ReleaseRoot "TabletMonitor.VirtualDisplay.cat"
          $WdkBin = Join-Path $PWD `
              "driver\packages\Microsoft.Windows.WDK.x64.10.0.28000.1839\c\bin\10.0.28000.0"

          if (-not (Test-Path -LiteralPath $Inf)) {
              throw "INF compilado não encontrado."
          }

          if (-not (Test-Path -LiteralPath $Dll)) {
              throw "DLL do driver não encontrada."
          }

          if (-not (Test-Path -LiteralPath $Catalog)) {
              $Inf2Cat = Join-Path $WdkBin "x86\Inf2Cat.exe"

              & $Inf2Cat `
                  "/driver:$ReleaseRoot" `
                  "/os:10_X64"

              if ($LASTEXITCODE -ne 0) {
                  throw "Inf2Cat falhou com o código $LASTEXITCODE."
              }
          }

          if (-not (Test-Path -LiteralPath $Catalog)) {
              throw "Catálogo do driver não encontrado."
          }

      - name: Sign driver catalog
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"
          $ReleaseRoot = Join-Path $PWD "driver\x64\Release"
          $Catalog = Join-Path $ReleaseRoot "TabletMonitor.VirtualDisplay.cat"
          $Cer = Join-Path $ReleaseRoot "TabletMonitor-Test.cer"
          $Pfx = Join-Path $env:RUNNER_TEMP "TabletMonitor-Test.pfx"
          $PasswordText = [Guid]::NewGuid().ToString("N")
          $Password = ConvertTo-SecureString `
              -String $PasswordText `
              -AsPlainText `
              -Force

          $SignToolPattern = `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe"

          $SignTool = Get-ChildItem `
              -Path $SignToolPattern `
              -File `
              -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1

          if ($null -eq $SignTool) {
              throw "SignTool.exe x64 não encontrado."
          }

          $Certificate = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=TabletMonitor Test Driver" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -HashAlgorithm "SHA256" `
              -KeyLength 2048 `
              -KeyExportPolicy Exportable `
              -NotAfter (Get-Date).AddYears(5)

          Export-PfxCertificate `
              -Cert $Certificate `
              -FilePath $Pfx `
              -Password $Password |
              Out-Null

          Export-Certificate `
              -Cert $Certificate `
              -FilePath $Cer |
              Out-Null

          & $SignTool.FullName `
              sign `
              /v `
              /fd SHA256 `
              /f $Pfx `
              /p $PasswordText `
              $Catalog

          if ($LASTEXITCODE -ne 0) {
              throw "A assinatura do catálogo falhou com o código $LASTEXITCODE."
          }

      - name: Verify driver signature
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"
          $ReleaseRoot = Join-Path $PWD "driver\x64\Release"
          $Catalog = Join-Path $ReleaseRoot "TabletMonitor.VirtualDisplay.cat"
          $Cer = Join-Path $ReleaseRoot "TabletMonitor-Test.cer"
          $SignToolPattern = `
              "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe"

          $SignTool = Get-ChildItem `
              -Path $SignToolPattern `
              -File `
              -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1

          Import-Certificate `
              -FilePath $Cer `
              -CertStoreLocation "Cert:\CurrentUser\Root" |
              Out-Null

          Import-Certificate `
              -FilePath $Cer `
              -CertStoreLocation "Cert:\CurrentUser\TrustedPublisher" |
              Out-Null

          & $SignTool.FullName `
              verify `
              /v `
              /pa `
              $Catalog

          if ($LASTEXITCODE -ne 0) {
              throw "A verificação da assinatura falhou com o código $LASTEXITCODE."
          }

      - name: Assemble driver package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ReleaseRoot = Join-Path $PWD "driver\x64\Release"
          $Dist = Join-Path $PWD "driver\dist"
          $Pfx = Join-Path $env:RUNNER_TEMP "TabletMonitor-Test.pfx"

          New-Item `
              -ItemType Directory `
              -Path $Dist `
              -Force |
              Out-Null

          $PackageFiles = @(
              (Join-Path $ReleaseRoot "TabletMonitor.VirtualDisplay.inf"),
              (Join-Path $ReleaseRoot "TabletMonitor.VirtualDisplay.cat"),
              (Join-Path $ReleaseRoot "TabletMonitor.VirtualDisplay.dll"),
              (Join-Path $ReleaseRoot "TabletMonitor.VirtualDisplay.App.exe"),
              (Join-Path $ReleaseRoot "TabletMonitor-Test.cer"),
              (Join-Path $PWD "driver\Install-TabletMonitorVirtualDisplay.ps1"),
              (Join-Path $PWD "driver\README.md"),
              (Join-Path $PWD "driver\MS-PL.txt")
          )

          foreach ($PackageFile in $PackageFiles) {
              if (-not (Test-Path -LiteralPath $PackageFile)) {
                  throw "Arquivo do pacote não encontrado: $PackageFile"
              }

              Copy-Item `
                  -LiteralPath $PackageFile `
                  -Destination $Dist `
                  -Force
          }

          if (Test-Path -LiteralPath $Pfx) {
              Remove-Item `
                  -LiteralPath $Pfx `
                  -Force
          }

          Get-ChildItem `
              -LiteralPath $Dist |
              Select-Object Name, Length |
              Format-Table -AutoSize
      - name: Upload driver package
        uses: actions/upload-artifact@v4
        with:
          name: TabletMonitor-VirtualDisplay-x64
          path: driver/dist/
          if-no-files-found: error
          retention-days: 14
